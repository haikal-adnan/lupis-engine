<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupis Engine</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: rgb(0, 0, 0);
            overflow: hidden;
        }
    </style>

    <style>
        #mobile-controls {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;
        z-index: 9999;
        display: flex;
        justify-content: space-between;
        padding: 0 40px;
        pointer-events: auto;
        }

        #mobile-controls button {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: none;
        background: rgba(255,255,255,0.3);
        color: white;
        font-size: 24px;
        font-weight: bold;
        backdrop-filter: blur(4px);
        box-shadow: 0 0 5px rgba(0,0,0,0.3);
        user-select: none;
        }

        #btn-jump {
        position: absolute;
        right: 30px;
        bottom: 80px;
        }
        </style>
</head>
<body>
<canvas id="glCanvas" style="background-color: black; position:absolute; z-index:0;"></canvas>
<canvas id="uiCanvas" style="position:absolute; z-index:1; pointer-events:none;"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
