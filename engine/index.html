<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lupis Engine Standalone</title>
  
  <style>
    html, body { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        background: #000; 
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #lp_canvas_preview { 
        display: block; 
        outline: none; 
        background: #111;
        box-shadow: 0 0 50px rgba(0,0,0,0.5); 
        max-width: 100%;
        max-height: 100%;
    }

    #loading { 
        position: absolute; 
        inset: 0; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        color: #888; 
        font-family: sans-serif; 
        background: #111; 
        z-index: 10; 
    }
    
    .hidden { display: none !important; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "/engine/": "/engine/",
      "/projects/": "/projects/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">Loading Project...</div>
  <canvas id="lp_canvas_preview" tabindex="0"></canvas>

<script type="module">
    import { startEngine } from "./Runtime.js";

    const PROJECT_FOLDER = "./project"; 
    const loadingEl = document.getElementById("loading");
    const canvasEl = document.getElementById("lp_canvas_preview");

    function setupCanvasResponsiveness(refWidth = 1920, refHeight = 1080) {
        canvasEl.width = refWidth;
        canvasEl.height = refHeight;

        const onResize = () => {
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            const targetRatio = refWidth / refHeight;
            const winRatio = winW / winH;

            let finalW, finalH;

            if (winRatio > targetRatio) {
                finalH = winH;
                finalW = finalH * targetRatio;
            } else {
                finalW = winW;
                finalH = finalW / targetRatio;
            }

            canvasEl.style.width = `${finalW}px`;
            canvasEl.style.height = `${finalH}px`;
        };

        window.addEventListener('resize', onResize);
        onResize(); 
    }

    async function initStandalone() {
        try {
            loadingEl.classList.remove("hidden");
            loadingEl.innerText = "Starting Engine...";

            setupCanvasResponsiveness(1920, 1080);
            await startEngine(canvasEl, PROJECT_FOLDER);

            loadingEl.classList.add("hidden");
            canvasEl.focus();
        } catch (error) {
            loadingEl.innerText = `Error: ${error.message}`;
            console.error("[Standalone] Error starting game:", error);
        }
    }

    initStandalone();
    </script>
</body>
</html>
