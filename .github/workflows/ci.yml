name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-standards:
    name: Standards & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install Tests Dependencies
        run: |
          cd tests
          npm ci

      - name: Run E2E Standard Verification
        run: node tests/scripts/check-standard.mjs

  editor-build-and-test:
    name: Editor Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: editor/package-lock.json

      - name: Install Editor Dependencies
        run: |
          cd editor
          npm ci

      - name: Run Editor Unit Tests (Vitest)
        run: |
          cd editor
          npm run test:run

      - name: Build Editor Distribution
        run: |
          cd editor
          npm run build

  service-smoke-check:
    name: Backend Service Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: service/package-lock.json

      - name: Install Service Dependencies
        run: |
          cd service
          npm ci --omit=dev

      - name: Validate Server Syntax
        run: |
          cd service
          node --check server.js
          node --check runner/main.js

  e2e-contracts:
    name: Playwright Contract Verification
    needs: [editor-build-and-test, service-smoke-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tests/package-lock.json

      - name: Install Test Dependencies
        run: |
          cd tests
          npm ci

      - name: Install Playwright Browsers (Chromium)
        run: |
          cd tests
          npx playwright install --with-deps chromium

      - name: Run Contract Tests
        run: |
          cd tests
          npm run test:contract || true
