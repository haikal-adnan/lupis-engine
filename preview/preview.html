<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lupis Engine Preview</title>
  <style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
  }
  #glPreviewCanvas,
  #uiPreviewCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #bbb;
    font-family: sans-serif;
  }
</style>
  <script type="importmap">
  {
    "imports": {
      "@engine/": "/engine/",
      "@utils/": "/utils/",
      "@projects/": "/projects/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">Ngopi oy</div>
  <canvas id="glPreviewCanvas"></canvas>

  <script type="module">
    import { startEngine } from "@engine/main.js";
    import { initEngine } from "@projects/template-platformer/code/Main.js";

    await initEngine("glPreviewCanvas");
    await startEngine("glPreviewCanvas", "runtime");
  </script>
</body>
</html>
