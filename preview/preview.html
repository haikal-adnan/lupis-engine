<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lupis Engine Preview</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #lp_canvas_preview { position: absolute; inset: 0; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ccc; font-family: sans-serif; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "/engine/": "/engine/",
      "/projects/": "/projects/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">Waiting for project...</div>
  <canvas id="lp_canvas_preview"></canvas>

  <script type="module">
    import { startEngine } from "/engine/main.js";

    let pending = null;
    let engineStarted = false;

    function canvasReady() {
      const el = document.getElementById("lp_canvas_preview");
      return el instanceof HTMLCanvasElement;
    }

    async function boot() {
      if (engineStarted) return;
      if (!pending) return;
      if (!canvasReady()) return;
      engineStarted = true;
      document.getElementById("loading").style.display = "none";
      window.LUPIS = window.LUPIS || {};
      window.LUPIS.runtime = { project: pending.project, scene: pending.scene };
      await startEngine("lp_canvas_preview", "runtime", pending.basePath || "/projects/template/");
    }

    window.addEventListener("message", (event) => {
      if (!event.data) return;
      if (event.data.type === "projectData") {
        pending = event.data.payload;
        setTimeout(boot, 50);
        return;
      }
      if (event.data.type === "requestProject") {
        window.opener?.postMessage?.({ type: "requestProject" }, "*");
        return;
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      window.opener?.postMessage?.({ type: "previewReady" }, "*");
      if (pending) boot();
    });
  </script>
</body>
</html>
