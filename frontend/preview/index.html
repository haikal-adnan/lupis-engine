<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lupis Engine Preview</title>
  
  <script>
    // Jika window.name BUKAN "LupisPreview", berarti user akses manual / direct link.
    // Kita "pura-pura" jadi 404.
    if (window.name !== "LupisPreview") {
      document.title = "404 Not Found";
      document.body.style.backgroundColor = "white";
      document.body.innerHTML = `
        <div style="font-family: sans-serif; text-align: center; margin-top: 50px;">
            <h1>404 Not Found</h1>
            <p>nginx/1.18.0 (Ubuntu)</p>
        </div>
      `;
      // Hentikan eksekusi script selanjutnya
      throw new Error("Direct Access Denied: 404 Simulation"); 
    }
  </script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #lp_canvas_preview { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-family: sans-serif; background: #111; z-index: 10; }
    .hidden { display: none !important; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "/engine/": "/engine/",
      "/projects/": "/projects/"
    }
  }
  </script>
</head>
<body>
  <div id="loading">Connecting...</div>
  <canvas id="lp_canvas_preview" tabindex="0"></canvas>

  <script type="module">
    import { startEngine } from "/engine/main.js";

    const CHANNEL_NAME = "lupis_engine_preview_channel";
    const STORAGE_KEY = "lupis_temp_scene_data";
    const loadingEl = document.getElementById("loading");
    const canvasEl = document.getElementById("lp_canvas_preview");
    const channel = new BroadcastChannel(CHANNEL_NAME);

    async function runGame(payload) {
        try {
            loadingEl.classList.remove("hidden");
            loadingEl.innerText = "Starting Engine...";
            
            await startEngine(canvasEl, "runtime", payload);

            loadingEl.classList.add("hidden");
            canvasEl.focus();
        } catch (error) {
            loadingEl.innerText = error.message;
            console.error(error);
        }
    }

    // Logic Reload & Session Storage
    const savedData = sessionStorage.getItem(STORAGE_KEY);
    
    if (savedData) {
        const payload = JSON.parse(savedData);
        runGame(payload);
    } else {
        channel.postMessage({ type: "REQUEST_LATEST_DATA" });
    }

    channel.onmessage = (event) => {
        const { type, payload } = event.data;

        if (type === "SCENE_UPDATE") {
            sessionStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            window.location.reload();
        }
    };
  </script>
</body>
</html>
